name: toropass_wallet
description: "Toropass Wallet"
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_dotenv: ^6.0.1
  flutter_riverpod: ^3.3.1
  flutter_screenutil: ^5.9.3
  go_router: ^17.2.3
  flutter_secure_storage: ^10.2.0
  flutter_svg: ^2.3.0
  intl: ^0.20.2
  local_auth: ^3.0.1
  local_auth_android: ^2.0.5
  local_auth_darwin: ^2.0.3
  path_provider: ^2.1.5
  permission_handler: ^12.0.1
  pretty_dio_logger: ^1.4.0
  url_launcher: ^6.3.2
  shared_preferences: ^2.5.5
  shimmer: ^3.0.0
  skeletonizer: ^2.1.3
  cached_network_image: ^3.4.1
  dio: ^5.9.2
  device_info_plus: ^13.1.0
  package_info_plus: ^10.1.0
  screen_protector: ^1.5.1
  crypto: ^3.0.7
  riverpod_annotation: ^4.0.2
  equatable: ^2.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.15.0
  flutter_lints: ^6.0.0
  riverpod_generator: ^4.0.3
  flutter_gen_runner: ^5.13.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7

flutter_gen:
  output: lib/generated

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/images/ToroID.png"
  background_color_ios: "#FBF9FB"
  adaptive_icon_background: "#FBF9FB"
  adaptive_icon_foreground: "assets/images/ToroID.png"
  adaptive_icon_monochrome: "assets/images/ToroID.png"

flutter_native_splash:
  color: "#FFFFFF"
  image: assets/images/splash.png
  android_12:
    color: "#FFFFFF"
    image: assets/images/splash_android12.png
    icon_background_color: "#FBF9FB"
  web: true

flutter:
  uses-material-design: true

  assets:
    - assets/fonts/
    - assets/images/
    - assets/icons/
    - .env

  fonts:
    - family: Inter-Bold
      fonts:
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
    - family: Inter-Medium
      fonts:
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
    - family: Inter-Regular
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
    - family: Inter-SemiBold
      fonts:
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
    - family: PlusJakartaSans-Bold
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Bold.ttf
          weight: 700
    - family: PlusJakartaSans-Medium
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Medium.ttf
          weight: 500
    - family: PlusJakartaSans-Regular
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Regular.ttf
          weight: 400
    - family: PlusJakartaSans-SemiBold
      fonts:
        - asset: assets/fonts/PlusJakartaSans-SemiBold.ttf
          weight: 600
