name: Deploy ToroPass Issuer to GCP VM

on:
  push:
    branches:
      - main
    paths:
      - 'backend/toropass_issuer/**' # Only trigger if backend changes

jobs:
  # ==========================================
  # COMBINED BUILD & DEPLOY JOB (Much Faster)
  # ==========================================
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PNPM
        uses: pnpm/action-setup@v3
        with:
          version: 8

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install Monorepo Dependencies
        # --frozen-lockfile stops pnpm from checking for updates, making it much faster
        run: pnpm install --frozen-lockfile 

      - name: Generate Prisma Client (Local)
        run: pnpm --filter toropass_issuer exec prisma generate

      - name: Build Application
        run: pnpm --filter toropass_issuer build

      - name: Compress Build Files
        run: |
          cd backend/toropass_issuer
          tar -czf deploy.tar.gz dist package.json prisma

      # SCP directly from this runner, skipping the slow Upload/Download Artifact steps
      - name: Secure Copy (SCP) to GCP VM
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.GCP_VM_IP }}
          username: ${{ secrets.GCP_USERNAME }}
          key: ${{ secrets.GCP_SSH_KEY }}
          source: "backend/toropass_issuer/deploy.tar.gz"
          target: "/home/${{ secrets.GCP_USERNAME }}/server/"
          # strip_components removes the 'backend/toropass_issuer' folder structure 
          # on the server, putting deploy.tar.gz directly into /server/
          strip_components: 2 

      - name: Execute Server Setup and Restart
        uses: appleboy/ssh-action@master
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        with:
          host: ${{ secrets.GCP_VM_IP }}
          username: ${{ secrets.GCP_USERNAME }}
          key: ${{ secrets.GCP_SSH_KEY }}
          command_timeout: 10m
          envs: DATABASE_URL
          script: |
            cd /home/${{ secrets.GCP_USERNAME }}/server
            
            # Unzip the new code and clean up the archive
            tar -xzf deploy.tar.gz
            rm deploy.tar.gz

            # Install production dependencies FAST (skips slow audits and funding text)
            npm install --omit=dev --no-audit --no-fund

            # ==========================================
            # PRISMA BUG FIX: Explicitly create the .env file
            # ==========================================
            echo "DATABASE_URL=\"${DATABASE_URL}\"" > .env
            
            # Double-down by exporting it to the immediate shell session
            export DATABASE_URL="${DATABASE_URL}"

            # Generate the Prisma client native to the Ubuntu server architecture
            npx prisma generate
            
            # Run pending migrations against the database
            npx prisma migrate deploy

            # Graceful restart
            pm2 reload server || pm2 start dist/src/main.js --name server
            
            # Ensure PM2 remembers this app on server reboot
            pm2 save